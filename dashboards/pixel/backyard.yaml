title: Backyard
path: backyard
icon: mdi:pine-tree
cards:
  - type: custom:decluttering-card
    template: nav_bar
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-title-card
        subtitle: Backyard
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.backyard_garage_lights_lr
            name: Garage Sconce
          - type: custom:mushroom-light-card
            entity: light.fence_lights_2
          - type: custom:mushroom-light-card
            entity: light.pergola_lights_new_2
            name: Pergola
          - type: custom:mushroom-light-card
            entity: light.playset_lights_2
          - type: custom:mushroom-entity-card
            entity: switch.patio_fans
          - type: custom:mushroom-entity-card
            entity: switch.backyard_fountain
      - type: custom:mushroom-title-card
        title: Holiday Override
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:heart
            icon_color: red
            content: Val
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.holiday_lights_apply_season
                variables:
                  season: valentines
          - type: template
            icon: mdi:clover
            icon_color: green
            content: StPats
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.holiday_lights_apply_season
                variables:
                  season: stpats
          - type: template
            icon: mdi:egg-easter
            icon_color: purple
            content: Easter
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.holiday_lights_apply_season
                variables:
                  season: easter
          - type: template
            icon: mdi:flag-variant
            icon_color: blue
            content: RWB
            tap_action:
              action: call-service
              service_data:
                entity_id: automation.holiday_lights_apply_season
                variables:
                  season: rwb
          - type: template
            icon: mdi:ghost
            icon_color: orange
            content: 👻
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.holiday_lights_apply_season
                variables:
                  season: halloween
          - type: template
            icon: mdi:turkey
            icon_color: amber
            content: Thanks
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.holiday_lights_apply_season
                variables:
                  season: thanks
          - type: template
            icon: mdi:pine-tree
            icon_color: green
            content: Xmas
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.holiday_lights_apply_season
                variables:
                  season: xmas
          - type: template
            icon: mdi:brightness-5
            icon_color: yellow
            content: Default
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.holiday_lights_apply_season
                variables:
                  season: default
      - type: custom:mushroom-title-card
        title: Sports
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:football
            icon_color: '#e31937'
            content: Huskers
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.sports_lights_game_day
                variables:
                  active_team: huskers
          - type: template
            icon: mdi:football
            icon_color: '#ae192d'
            content: Cyclones
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.sports_lights_game_day
                variables:
                  active_team: cyclones
          - type: template
            icon: mdi:football
            icon_color: '#002a5c'
            content: Seahawks
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.sports_lights_game_day
                variables:
                  active_team: seahawks
          - type: template
            icon: mdi:baseball
            icon_color: '#004687'
            content: Royals
            tap_action:
              action: call-service
              service: script.royals_lights
subview: true
