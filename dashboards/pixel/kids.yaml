title: Kids
path: kids
icon: mdi:human-male-child
cards:
  - type: custom:decluttering-card
    template: nav_bar
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Kids' Rooms
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-title-card
            subtitle: Savannah
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                entity: sensor.savannahs_bathroom_door_temperature
                content: '{{ states(entity) }}°F'
                icon: mdi:thermometer
                icon_color: >
                  {% set t = states(entity) | float(0) %} {% if t > 75 %} red {%
                  elif t < 60 %} blue {% else %} black {% endif %}
              - type: template
                entity: binary_sensor.savannah_window_lr_contact
                content: '{{ ''Open'' if is_state(entity, ''on'') else ''Closed'' }}'
                icon: >-
                  {{ 'mdi:window-open-variant' if is_state(entity, 'on') else
                  'mdi:window-closed-variant' }}
                icon_color: '{{ ''red'' if is_state(entity, ''on'') else ''green'' }}'
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.savannah_lights
                name: Main
              - type: custom:mushroom-light-card
                entity: light.savannah_dome_lights
                name: Dome
              - type: custom:mushroom-light-card
                entity: light.hue_savannah_light_strip
                name: Strip
              - type: custom:mushroom-light-card
                entity: light.savannah_auxiliary_switch
                name: Aux
          - type: custom:mini-media-player
            entity: media_player.savannah
            name: Savannah's Sonos
            artwork: material
            hide:
              power: true
              source: true
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-title-card
            subtitle: Claire
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                entity: sensor.claires_bathroom_door_temperature
                content: '{{ states(entity) }}°F'
                icon: mdi:thermometer
                icon_color: >
                  {% set t = states(entity) | float(0) %} {% if t > 75 %} red {%
                  elif t < 60 %} blue {% else %} black {% endif %}
              - type: template
                entity: binary_sensor.claire_window_lr_contact
                content: '{{ ''Open'' if is_state(entity, ''on'') else ''Closed'' }}'
                icon: >-
                  {{ 'mdi:window-open-variant' if is_state(entity, 'on') else
                  'mdi:window-closed-variant' }}
                icon_color: '{{ ''red'' if is_state(entity, ''on'') else ''green'' }}'
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.claire_lights
                name: Main
              - type: custom:mushroom-light-card
                entity: light.claire_dome_lights
                name: Dome
              - type: custom:mushroom-light-card
                entity: light.claire_light_strip
                name: Strip
              - type: custom:mushroom-entity-card
                entity: switch.claire_aux_new
                name: Aux
          - type: custom:mini-media-player
            entity: media_player.claire
            name: Claire's Sonos
            artwork: material
            hide:
              power: true
              source: true
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-title-card
            subtitle: Hudson
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                entity: sensor.hudsons_bedroom_door_temperature
                content: '{{ states(entity) }}°F'
                icon: mdi:thermometer
                icon_color: >
                  {% set t = states(entity) | float(0) %} {% if t > 75 %} red {%
                  elif t < 60 %} blue {% else %} black {% endif %}
              - type: template
                icon: >-
                  {% if is_state('binary_sensor.hudson_north_window_lr_contact',
                  'on') or is_state('binary_sensor.hudsons_east_window_contact',
                  'on') %}
                    mdi:window-open-variant
                  {% else %}
                    mdi:window-closed-variant
                  {% endif %}
                icon_color: >-
                  {% if is_state('binary_sensor.hudson_north_window_lr_contact',
                  'on') or is_state('binary_sensor.hudsons_east_window_contact',
                  'on') %}
                    red
                  {% else %}
                    green
                  {% endif %}
                content: >-
                  {% set n =
                  is_state('binary_sensor.hudson_north_window_lr_contact', 'on')
                  %} {% set e =
                  is_state('binary_sensor.hudsons_east_window_contact', 'on') %}
                  {% if n and e %} Both Open {% elif n %} N Open {% elif e %} E
                  Open {% else %} Closed {% endif %}
              - type: template
                entity: switch.kid_door_alerts_vs
                content: Hud Motion Alerts
                icon: mdi:bell
                icon_color: '{{ ''red'' if is_state(entity, ''on'') else ''grey'' }}'
                tap_action:
                  action: toggle
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.hudson_lights
                name: Main
              - type: custom:mushroom-light-card
                entity: light.hudson_dome_lights
                name: Dome
              - type: custom:mushroom-light-card
                entity: light.hue_hud_light_strip
                name: Strip
              - type: custom:mushroom-entity-card
                entity: switch.hudson_aux_switch
                name: Aux
          - type: custom:mini-media-player
            entity: media_player.hudson
            name: Hudson's Sonos
            artwork: material
            hide:
              power: true
              source: true
subview: true
