title: Master
path: master
icon: mdi:bed-king
cards:
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Home
        icon: mdi:home
        icon_color: grey
        tap_action:
          action: navigate
          navigation_path: /dashboard-pixeltabs/home
      - type: custom:mushroom-template-card
        primary: Climate
        icon: mdi:thermostat
        icon_color: grey
        tap_action:
          action: navigate
