      - type: custom:mushroom-title-card
        subtitle: Master
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.master_bedroom_entry_lights
            name: Entry
          - type: custom:mushroom-light-card
            entity: light.master_bedroom_main_lights
            name: Main
          - type: custom:mushroom-entity-card
