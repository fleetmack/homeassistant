alias: "Blinds — Close East (Sun Leaves East Face) (Year-Round)"
description: >-
  Closes East blinds after morning sun leaves the East face (shades in summer,
  insulates shaded glass in winter).
triggers:
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 135
conditions:
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 5
actions:
  - repeat:
      count: 3
      sequence:
        - action: cover.close_cover
          target:
            entity_id:
              - cover.entry_blinds_homekit
              - cover.top_of_stairs
        - delay:
            seconds: 10
        - action: cover.close_cover
          target:
            entity_id:
              - cover.laundy
              - cover.loft_loft_east_left
        - delay:
            seconds: 10
        - action: cover.close_cover
          target:
            entity_id:
              - cover.loft_loft_east_middle
              - cover.loft_loft_east_right
        - delay:
            seconds: 10
        - action: cover.close_cover
          target:
            entity_id:
              - cover.piano_blinds_piano_ne
              - cover.piano_blinds_piano_se
        - delay:
            seconds: 20
        - if:
            - condition: state
              entity_id: cover.entry_blinds_homekit
              state: closed
            - condition: state
              entity_id: cover.top_of_stairs
              state: closed
            - condition: state
              entity_id: cover.laundy
              state: closed
            - condition: state
              entity_id: cover.loft_loft_east_left
              state: closed
            - condition: state
              entity_id: cover.loft_loft_east_middle
              state: closed
            - condition: state
              entity_id: cover.loft_loft_east_right
              state: closed
            - condition: state
              entity_id: cover.piano_blinds_piano_ne
              state: closed
            - condition: state
              entity_id: cover.piano_blinds_piano_se
              state: closed
          then:
            - stop: All east blinds closed successfully
mode: single
