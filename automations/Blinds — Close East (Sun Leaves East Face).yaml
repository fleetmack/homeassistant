alias: Blinds — Close East (Sun Leaves East Face)
description: ''
triggers:
  - entity_id: sun.sun
    attribute: azimuth
    above: 135
    trigger: numeric_state
conditions:
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 10
  - condition: or
    conditions:
      - condition: state
        entity_id: climate.honeywell_t_stat_main_floor
        state: cool
      - condition: numeric_state
        entity_id: sensor.today_forecast_high
        above: 70
actions:
  - repeat:
      count: 3
      sequence:
        - target:
            entity_id:
              - cover.entry_blinds_homekit
              - cover.top_of_stairs
          action: cover.close_cover
        - delay:
            seconds: 10
        - target:
            entity_id:
              - cover.laundy
              - cover.loft_loft_east_left
          action: cover.close_cover
        - delay:
            seconds: 10
        - target:
            entity_id:
              - cover.loft_loft_east_middle
              - cover.loft_loft_east_right
          action: cover.close_cover
        - delay:
            seconds: 10
        - target:
            entity_id:
              - cover.piano_blinds_piano_ne
              - cover.piano_blinds_piano_se
          action: cover.close_cover
        - delay:
            seconds: 20
        - if:
            - condition: state
              entity_id: cover.entry_blinds_homekit
              state: closed
            - condition: state
              entity_id: cover.top_of_stairs
              state: closed
            - condition: state
              entity_id: cover.laundy
              state: closed
            - condition: state
              entity_id: cover.loft_loft_east_left
              state: closed
            - condition: state
              entity_id: cover.loft_loft_east_middle
              state: closed
            - condition: state
              entity_id: cover.loft_loft_east_right
              state: closed
            - condition: state
              entity_id: cover.piano_blinds_piano_ne
              state: closed
            - condition: state
              entity_id: cover.piano_blinds_piano_se
              state: closed
          then:
            - stop: All east blinds closed successfully
mode: single
