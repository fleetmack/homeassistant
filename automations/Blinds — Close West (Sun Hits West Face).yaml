alias: Blinds — Close West (Sun Hits West Face)
description: ''
triggers:
  - entity_id: sun.sun
    attribute: azimuth
    above: 225
    trigger: numeric_state
conditions:
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 10
  - condition: or
    conditions:
      - condition: state
        entity_id: climate.honeywell_t_stat_main_floor
        state: cool
      - condition: numeric_state
        entity_id: sensor.today_forecast_high
        above: 70
actions:
  - repeat:
      count: 3
      sequence:
        - target:
            entity_id:
              - cover.kitchen_blinds_kitchen_wl
              - cover.kitchen_blinds_kitchen_wm
          action: cover.close_cover
        - delay:
            seconds: 10
        - target:
            entity_id:
              - cover.kitchen_blinds_kitchen_wr
              - cover.living_room_shades_all_homekit
          action: cover.close_cover
        - delay:
            seconds: 15
        - if:
            - condition: state
              entity_id: cover.kitchen_blinds_kitchen_wl
              state: closed
            - condition: state
              entity_id: cover.kitchen_blinds_kitchen_wm
              state: closed
            - condition: state
              entity_id: cover.kitchen_blinds_kitchen_wr
              state: closed
            - condition: state
              entity_id: cover.living_room_shades_all_homekit
              state: closed
          then:
            - stop: All west blinds closed successfully
mode: single
