alias: "Blinds — Close West (Sun Hits West Face - Warm Sunny Days)"
description: >-
  Blocks hot afternoon sun on West windows ONLY on warm days when cloud coverage
  is below 60% and the blinds killswitch is OFF.
triggers:
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 225
conditions:
  - condition: state
    entity_id: input_boolean.blinds_killswitch
    state: "off"
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 10
  # Only close to block heat if the sun is actually shining (< 60% clouds)
  - condition: numeric_state
    entity_id: weather.forecast_home_2
    attribute: cloud_coverage
    below: 60
  - condition: state
    entity_id: weather.forecast_home_2
    state:
      - sunny
      - partlycloudy
      - windy
  - condition: or
    conditions:
      - condition: state
        entity_id: climate.honeywell_t_stat_main_floor
        state: cool
      - condition: numeric_state
        entity_id: sensor.today_forecast_high
        above: 70
actions:
  - repeat:
      count: 3
      sequence:
        - action: cover.close_cover
          target:
            entity_id:
              - cover.kitchen_blinds_kitchen_wl
              - cover.kitchen_blinds_kitchen_wm
        - delay:
            seconds: 10
        - action: cover.close_cover
          target:
            entity_id:
              - cover.kitchen_blinds_kitchen_wr
              - cover.living_room_shades_all_homekit
        - delay:
            seconds: 15
        - if:
            - condition: state
              entity_id: cover.kitchen_blinds_kitchen_wl
              state: closed
            - condition: state
              entity_id: cover.kitchen_blinds_kitchen_wm
              state: closed
            - condition: state
              entity_id: cover.kitchen_blinds_kitchen_wr
              state: closed
            - condition: state
              entity_id: cover.living_room_shades_all_homekit
              state: closed
          then:
            - stop: All west blinds closed successfully
mode: single
