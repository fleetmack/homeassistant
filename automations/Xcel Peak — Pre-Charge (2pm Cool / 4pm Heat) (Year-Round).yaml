alias: "Xcel Peak — Pre-Charge (2pm Cool / 4pm Heat) (Year-Round)"
description: >-
  Pre-cools at 2pm in summer (respecting the 1:30pm upstairs boost) and
  pre-heats at 4pm in winter on weekdays before the 5pm Xcel peak window.
triggers:
  - trigger: time
    at: "14:00:00"
    id: precool
  - trigger: time
    at: "16:00:00"
    id: preheat
conditions:
  - condition: state
    entity_id: input_boolean.hvac_killswitch
    state: "off"
  - condition: time
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
actions:
  - choose:
      # ==========================================
      # SUMMER 2:00 PM PRE-COOL BRANCH
      # ==========================================
      - conditions:
          - condition: trigger
            id: precool
          - condition: or
            conditions:
              - condition: state
                entity_id: climate.honeywell_t_stat_main_floor
                state: cool
              - condition: state
                entity_id: climate.honeywell_t_stat_upstairs
                state: cool
        sequence:
          - if:
              - condition: state
                entity_id: climate.honeywell_t_stat_main_floor
                state: cool
            then:
              - action: climate.set_temperature
                target:
                  entity_id: climate.honeywell_t_stat_main_floor
                data:
                  temperature: 72
          - delay: "00:00:15"
          - if:
              - condition: state
                entity_id: climate.honeywell_t_stat_upstairs
                state: cool
            then:
              - action: climate.set_temperature
                target:
                  entity_id: climate.honeywell_t_stat_upstairs
                data:
                  # Preserves 71°F if the 1:30pm boost is active, otherwise 72°F
                  temperature: >
                    {{ 71 if state_attr('climate.honeywell_t_stat_upstairs', 'temperature') == 71 else 72 }}
          - action: notify.pixel_9_pro
            data:
              title: 🌞 Pre-cooling started
              message: >-
                House is pre-cooling. Peak hours start at 5pm — thermostats will
                float warm then.
          - delay: "00:01:00"
          - action: homeassistant.update_entity
            target:
              entity_id:
                - climate.honeywell_t_stat_main_floor
                - climate.honeywell_t_stat_upstairs
          # Cloud Verification Retry
          - if:
              - condition: or
                conditions:
                  - condition: and
                    conditions:
                      - condition: state
                        entity_id: climate.honeywell_t_stat_main_floor
                        state: cool
                      - condition: numeric_state
                        entity_id: climate.honeywell_t_stat_main_floor
                        attribute: temperature
                        above: 72
                  - condition: and
                    conditions:
                      - condition: state
                        entity_id: climate.honeywell_t_stat_upstairs
                        state: cool
                      - condition: numeric_state
                        entity_id: climate.honeywell_t_stat_upstairs
                        attribute: temperature
                        above: 72
            then:
              - if:
                  - condition: state
                    entity_id: climate.honeywell_t_stat_main_floor
                    state: cool
                then:
                  - action: climate.set_temperature
                    target:
                      entity_id: climate.honeywell_t_stat_main_floor
                    data:
                      temperature: 72
              - delay: "00:00:15"
              - if:
                  - condition: state
                    entity_id: climate.honeywell_t_stat_upstairs
                    state: cool
                then:
                  - action: climate.set_temperature
                    target:
                      entity_id: climate.honeywell_t_stat_upstairs
                    data:
                      temperature: >
                        {{ 71 if state_attr('climate.honeywell_t_stat_upstairs', 'temperature') == 71 else 72 }}
              - action: notify.pixel_9_pro
                data:
                  title: ⚠️ HVAC Pre-Cool Retry
                  message: >-
                    One or more thermostats missed the 2pm pre-cool target. Sent
                    a forceful rewrite.

      # ==========================================
      # WINTER 4:00 PM PRE-HEAT BRANCH
      # ==========================================
      - conditions:
          - condition: trigger
            id: preheat
          - condition: or
            conditions:
              - condition: state
                entity_id: climate.honeywell_t_stat_main_floor
                state: heat
              - condition: state
                entity_id: climate.honeywell_t_stat_upstairs
                state: heat
        sequence:
          - if:
              - condition: state
                entity_id: climate.honeywell_t_stat_main_floor
                state: heat
            then:
              - action: climate.set_temperature
                target:
                  entity_id: climate.honeywell_t_stat_main_floor
                data:
                  temperature: 70
          - delay: "00:00:15"
          - if:
              - condition: state
                entity_id: climate.honeywell_t_stat_upstairs
                state: heat
            then:
              - action: climate.set_temperature
                target:
                  entity_id: climate.honeywell_t_stat_upstairs
                data:
                  temperature: 69
          - action: notify.pixel_9_pro
            data:
              title: 🔥 Pre-heating started
              message: >-
                Banking heat before 5pm Xcel peak window. System will float to
                66°F at 5pm.
          - delay: "00:01:00"
          - action: homeassistant.update_entity
            target:
              entity_id:
                - climate.honeywell_t_stat_main_floor
                - climate.honeywell_t_stat_upstairs
          # Cloud Verification Retry
          - if:
              - condition: or
                conditions:
                  - condition: and
                    conditions:
                      - condition: state
                        entity_id: climate.honeywell_t_stat_main_floor
                        state: heat
                      - condition: numeric_state
                        entity_id: climate.honeywell_t_stat_main_floor
                        attribute: temperature
                        below: 70
                  - condition: and
                    conditions:
                      - condition: state
                        entity_id: climate.honeywell_t_stat_upstairs
                        state: heat
                      - condition: numeric_state
                        entity_id: climate.honeywell_t_stat_upstairs
                        attribute: temperature
                        below: 69
            then:
              - if:
                  - condition: state
                    entity_id: climate.honeywell_t_stat_main_floor
                    state: heat
                then:
                  - action: climate.set_temperature
                    target:
                      entity_id: climate.honeywell_t_stat_main_floor
                    data:
                      temperature: 70
              - delay: "00:00:15"
              - if:
                  - condition: state
                    entity_id: climate.honeywell_t_stat_upstairs
                    state: heat
                then:
                  - action: climate.set_temperature
                    target:
                      entity_id: climate.honeywell_t_stat_upstairs
                    data:
                      temperature: 69
              - action: notify.pixel_9_pro
                data:
                  title: ⚠️ HVAC Pre-Heat Retry
                  message: >-
                    One or more thermostats missed the 4pm pre-heat target. Sent
                    a forceful rewrite.
mode: single
