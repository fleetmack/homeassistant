alias: 'HVAC: Smart Shutoff & Restore (Optimized)'
description: >-
  Safely shuts down HVAC when doors are open and restores states sequentially to
  prevent Honeywell API drops.
triggers:
  - entity_id:
      - binary_sensor.patio_door
      - binary_sensor.front_door
      - binary_sensor.garage_yard
    to: 'on'
    for:
      minutes: 30
    trigger: state
conditions:
  - condition: or
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.honeywell_t_stat_main_floor
            state: 'off'
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.honeywell_t_stat_upstairs
            state: 'off'
actions:
  - variables:
      main_floor_old_mode: '{{ states(''climate.honeywell_t_stat_main_floor'') }}'
      upstairs_old_mode: '{{ states(''climate.honeywell_t_stat_upstairs'') }}'
  - if:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.honeywell_t_stat_main_floor
            state: 'off'
    then:
      - target:
          entity_id: climate.honeywell_t_stat_main_floor
        data:
          hvac_mode: 'off'
        action: climate.set_hvac_mode
  - delay: '00:00:10'
  - if:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.honeywell_t_stat_upstairs
            state: 'off'
    then:
      - target:
          entity_id: climate.honeywell_t_stat_upstairs
        data:
          hvac_mode: 'off'
        action: climate.set_hvac_mode
  - data:
      title: HVAC Disabled 🚪
      message: >-
        The A/C was turned off because an exterior door was left open for 30
        minutes.
    action: notify.notify
  - wait_for_trigger:
      - value_template: >
          {{ is_state('binary_sensor.kitching_sliding_door_sensor_contact',
          'off') and
             is_state('binary_sensor.front_door_sensor_contact', 'off') and
             is_state('binary_sensor.garage_yard_door_sensor_contact', 'off') }}
        trigger: template
    timeout: '08:00:00'
    continue_on_timeout: false
  - target:
      entity_id: climate.honeywell_t_stat_main_floor
    data:
      hvac_mode: '{{ main_floor_old_mode }}'
    action: climate.set_hvac_mode
  - delay: '00:00:10'
  - target:
      entity_id: climate.honeywell_t_stat_upstairs
    data:
      hvac_mode: '{{ upstairs_old_mode }}'
    action: climate.set_hvac_mode
  - data:
      title: HVAC Restored 🌬️
      message: >-
        All exterior doors have been closed. The HVAC has resumed its previous
        mode.
    action: notify.notify
mode: single
