alias: Xcel Peak — Pre-cool Upstairs Boost (1:30pm) (Optimized)
description: >-
  Safely steps down upstairs cooling before main pre-cool with explicit mode
  enforcement and a cloud verification loop.
triggers:
  - at: '13:30:00'
    trigger: time
conditions:
  - condition: state
    entity_id: input_boolean.hvac_killswitch
    state: 'off'
  - condition: template
    value_template: '{{ now().month >= 5 and now().month <= 9 }}'
  - condition: numeric_state
    entity_id: sensor.outside_temperature_temperature
    above: 81
  - condition: state
    entity_id: climate.honeywell_t_stat_upstairs
    state: cool
actions:
  - target:
      entity_id: climate.honeywell_t_stat_upstairs
    data:
      hvac_mode: cool
      temperature: 71
    action: climate.set_temperature
  - delay: '00:01:00'
  - action: homeassistant.update_entity
    target:
      entity_id: climate.honeywell_t_stat_upstairs
  - if:
      - condition: numeric_state
        entity_id: climate.honeywell_t_stat_upstairs
        attribute: temperature
        above: 71
    then:
      - target:
          entity_id: climate.honeywell_t_stat_upstairs
        data:
          hvac_mode: cool
          temperature: 71
        action: climate.set_temperature
      - data:
          title: ⚠️ HVAC Upstairs Boost Retry
          message: >-
            Upstairs missed the 1:30pm pre-cool boost target. Sent a forceful
            rewrite.
        action: notify.send_message
        target:
          entity_id: notify.pixel_9_pro
mode: single
