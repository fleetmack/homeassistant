alias: "Xcel Peak — Begin Float (5pm) (Year-Round)"
description: >-
  Floats temperatures during Xcel weekday peak hours (5-9pm) for both Cooling
  (Summer) and Heating (Winter) with cloud verification.
triggers:
  - trigger: time
    at: "17:00:00"
conditions:
  - condition: state
    entity_id: input_boolean.hvac_killswitch
    state: "off"
  # Xcel TOU Peak only applies Monday-Friday!
  - condition: time
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
  - condition: or
    conditions:
      - condition: state
        entity_id: climate.honeywell_t_stat_main_floor
        state:
          - cool
          - heat
      - condition: state
        entity_id: climate.honeywell_t_stat_upstairs
        state:
          - cool
          - heat
actions:
  # --- MAIN FLOOR ---
  - choose:
      - conditions:
          - condition: state
            entity_id: climate.honeywell_t_stat_main_floor
            state: cool
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.honeywell_t_stat_main_floor
            data:
              temperature: 79
      - conditions:
          - condition: state
            entity_id: climate.honeywell_t_stat_main_floor
            state: heat
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.honeywell_t_stat_main_floor
            data:
              temperature: 66
  - delay: "00:00:15"

  # --- UPSTAIRS ---
  - choose:
      - conditions:
          - condition: state
            entity_id: climate.honeywell_t_stat_upstairs
            state: cool
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.honeywell_t_stat_upstairs
            data:
              temperature: 80
      - conditions:
          - condition: state
            entity_id: climate.honeywell_t_stat_upstairs
            state: heat
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.honeywell_t_stat_upstairs
            data:
              temperature: 66

  # --- CLOUD VERIFICATION & RETRY ---
  - delay: "00:01:00"
  - action: homeassistant.update_entity
    target:
      entity_id:
        - climate.honeywell_t_stat_main_floor
        - climate.honeywell_t_stat_upstairs
  - if:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: climate.honeywell_t_stat_main_floor
                state: cool
              - condition: numeric_state
                entity_id: climate.honeywell_t_stat_main_floor
                attribute: temperature
                below: 79
          - condition: and
            conditions:
              - condition: state
                entity_id: climate.honeywell_t_stat_main_floor
                state: heat
              - condition: numeric_state
                entity_id: climate.honeywell_t_stat_main_floor
                attribute: temperature
                above: 66
    then:
      - action: climate.set_temperature
        target:
          entity_id: climate.honeywell_t_stat_main_floor
        data:
          temperature: >
            {{ 79 if is_state('climate.honeywell_t_stat_main_floor', 'cool') else 66 }}
      - action: notify.pixel_9_pro
        data:
          title: ⚡ HVAC Retry Executed
          message: "Main floor thermostat missed Xcel Peak target. Pushed rewrite."
mode: single
