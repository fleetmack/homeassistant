alias: "HVAC: Daily Mode by Forecast (Year-Round Denver)"
description: Sets HVAC mode at 6am using both high and low temps so chilly 65°F winter days still get heat.
triggers:
  - trigger: time
    at: "06:00:00"
conditions:
  - condition: state
    entity_id: input_boolean.hvac_killswitch
    state: "off"
actions:
  - choose:
      # SUMMER / HOT DAY: High > 78°F -> COOL
      - conditions:
          - condition: numeric_state
            entity_id: sensor.today_forecast_high
            above: 78
        sequence:
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: climate.honeywell_t_stat_main_floor
                    state: cool
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.honeywell_t_stat_main_floor
                data:
                  hvac_mode: cool
          - delay: "00:00:10"
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: climate.honeywell_t_stat_upstairs
                    state: cool
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.honeywell_t_stat_upstairs
                data:
                  hvac_mode: cool
          - action: notify.pixel_9_pro
            data:
              title: HVAC Update ❄️
              message: "Today's high is over 78°F. System set to COOL."

      # WINTER / COLD DAY: High < 65°F OR Current Outdoor Temp at 6am < 45°F -> HEAT
      - conditions:
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: sensor.today_forecast_high
                below: 65
              - condition: numeric_state
                entity_id: sensor.outside_temperature_temperature
                below: 45
        sequence:
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: climate.honeywell_t_stat_main_floor
                    state: heat
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.honeywell_t_stat_main_floor
                data:
                  hvac_mode: heat
          - delay: "00:00:10"
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: climate.honeywell_t_stat_upstairs
                    state: heat
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.honeywell_t_stat_upstairs
                data:
                  hvac_mode: heat
          - action: notify.pixel_9_pro
            data:
              title: HVAC Update 🔥
              message: "Chilly morning or high below 65°F. System set to HEAT."

    # MILD SHOULDER DAY (High 65-78°F AND Morning > 45°F) -> OFF
    default:
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: climate.honeywell_t_stat_main_floor
                state: "off"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.honeywell_t_stat_main_floor
            data:
              hvac_mode: "off"
      - delay: "00:00:10"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: climate.honeywell_t_stat_upstairs
                state: "off"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.honeywell_t_stat_upstairs
            data:
              hvac_mode: "off"
      - action: notify.pixel_9_pro
        data:
          title: HVAC Update 🌬️
          message: "Mild day ahead. System turned OFF."
